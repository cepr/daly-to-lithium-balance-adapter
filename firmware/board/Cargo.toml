[package]
name = "interface-board"
version = "0.1.0"
edition = "2024"
description = "Firmware of the s-BMS / DALY interface board (STM32G0B1KBT6)"
publish = false

[dependencies]
bridge-core = { path = "../core", features = ["defmt"] }

embassy-stm32 = { version = "0.6", features = ["defmt", "time-driver-any", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
embedded-io-async = "0.7"

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2.1"

defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[features]
# Exactly one target: the interface board (default) or the NUCLEO-G0B1RE dev board.
default = ["board"]
board = ["embassy-stm32/stm32g0b1kb"]
nucleo = ["embassy-stm32/stm32g0b1re"]
# Ignore the balancers and NTCs: report 3.9 V per cell and 25 °C, to test the BMCU link alone.
simulate = []

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
